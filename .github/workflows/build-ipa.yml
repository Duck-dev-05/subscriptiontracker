name: Build iOS IPA (TrollStore)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App (No Code Signing)
      run: |
        xcodebuild clean build \
          -project SubscriptionTracker.xcodeproj \
          -scheme SubscriptionTracker \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos

    - name: Package IPA for TrollStore
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/SubscriptionTracker.app Payload/
        zip -r SubscriptionTracker.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubscriptionTracker-TrollStore-IPA
        path: SubscriptionTracker.ipa
