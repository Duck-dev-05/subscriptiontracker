name: SubscriptionTracker
options:
  bundleIdPrefix: com.yourdomain
targets:
  SubscriptionTracker:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - .github
          - .git
          - DerivedData
          - Payload
          - SubscriptionTracker.xcodeproj
          - SubscriptionTracker.xcworkspace
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      # These settings are essential for standard SwiftUI apps
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.yourdomain.SubscriptionTracker
      SWIFT_VERSION: 5.0
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Development" # Or "Apple Distribution" depending on your cert
      DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # You must replace this with your Apple Developer Team ID
      INFOPLIST_KEY_CFBundleURLTypes:
        - CFBundleURLSchemes:
            - "REPLACE_WITH_REVERSED_CLIENT_ID"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.22.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0
